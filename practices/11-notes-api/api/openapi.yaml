openapi: 3.0.3
info:
  title: Notes API
  version: 1.0.0
  description: Учебный REST API для заметок (CRUD). Данные хранятся в памяти процесса.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /notes:
    get:
      summary: Список заметок
      description: Возвращает страницу заметок, отсортированных по id. Общее число подходящих заметок передаётся в заголовке X-Total-Count.
      tags: [notes]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 }, description: Номер страницы }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 }, description: Размер страницы }
        - { name: q, in: query, required: false, schema: { type: string }, description: Поиск по подстроке title без учёта регистра }
      responses:
        "200":
          description: Страница заметок
          headers:
            X-Total-Count:
              description: Общее количество заметок, подходящих под фильтр
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      summary: Создать заметку
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteCreate" }
      responses:
        "201":
          description: Заметка создана
          headers:
            Location:
              description: URL созданной заметки
              schema: { type: string, example: /api/v1/notes/1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /notes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 }, description: Идентификатор заметки }
    get:
      summary: Получить заметку
      tags: [notes]
      responses:
        "200":
          description: Заметка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Обновить заметку (частично)
      tags: [notes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteUpdate" }
      responses:
        "200":
          description: Обновлённая заметка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Удалить заметку
      tags: [notes]
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    Note:
      type: object
      required: [id, title, content, createdAt]
      properties:
        id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: Идея для лекции }
        content: { type: string, example: Добавить пример структуры API }
        createdAt: { type: string, format: date-time, example: "2025-10-18T12:00:00Z" }
        updatedAt: { type: string, format: date-time, example: "2025-10-19T09:30:00Z" }
    NoteCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: Новая заметка }
        content: { type: string, maxLength: 10000, example: Текст заметки }
    NoteUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: Обновлено }
        content: { type: string, maxLength: 10000, example: Новый текст }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: note not found }
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Заметка не найдена
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
